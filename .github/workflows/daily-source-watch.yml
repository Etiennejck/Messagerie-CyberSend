name: Daily tournament source watch

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-source-watch
  cancel-in-progress: true

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tournament sources
        run: node scripts/check-sources.mjs
      - name: Publish the daily source ledger
        run: |
          git config user.name "HoopScout Source Watch"
          git config user.email "actions@users.noreply.github.com"
          git add public/source-status.json
          git diff --cached --quiet || git commit -m "chore: refresh tournament sources"
          git push
